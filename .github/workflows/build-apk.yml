name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Flutter project and add app code
        run: |
          flutter create --org com.formulasphere --project-name formulasphere_app app
          cp mobile_app/lib/main.dart app/lib/main.dart
          cd app
          flutter pub add http flutter_math_fork flutter_secure_storage
          sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <application#' android/app/src/main/AndroidManifest.xml
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 23/' android/app/build.gradle.kts || true
          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 23/' android/app/build.gradle || true

      - name: Build APK
        working-directory: app
        run: flutter build apk --release --dart-define=API=${{ vars.API_URL || 'https://your-site.onrender.com/api/v1' }}

      - uses: actions/upload-artifact@v5
        with:
          name: FormulaSphere-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk